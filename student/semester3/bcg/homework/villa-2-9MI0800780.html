<!DOCTYPE html>

<html>
	<head>
		<style>
			body { margin: 0; }
			canvas { width: 100%; height: 100% }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.min.js",
				"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.min.js",
				"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.min.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
				"villa": "https://boytchev.github.io/CourseOKG/villa/villa.js"
			} }
		</script>
	</head>
	
	<body>
		<script type="module">
			import * as THREE from "three";
			import {villa, renderer, scene, camera, light, controls} from "villa";

			villa( '9MI0800780' ); // да е реалният фак.№
				
			// 1. преименувайте файла на villa-g-fn.html,
			//    g=номер на група, а fn=факултетен номер
			//    също попълнете коментара на третия ред!

			
			var geometry = new THREE.BoxGeometry( 2, 2, 2 ),
				material = new THREE.MeshLambertMaterial( {color: 'crimson'} );
				
			var cube = new THREE.Mesh( geometry, material );
				cube.position.set( 0, 1, 0 );
				cube.receiveShadow = true;
				cube.castShadow = true;
			
			scene.add( cube );

		</script>
		
	</body>
</html>
