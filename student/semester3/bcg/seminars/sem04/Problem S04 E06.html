<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";

			// Задача: направете полет над кристална планета
			// с големи, ръбести, лъскави кристали
			
			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( 0, -10, 100 );
			camera.lookAt( new THREE.Vector3() );

			// Планета - за момента е сфера, решете как да
			// я кристализирате цялата (подсказка - не чрез сфера)
			var geometry = new THREE.IcosahedronGeometry( 30, 2 );
			var material = new THREE.MeshPhongMaterial({
				color: 0x00ffcc,
				flatShading: true, // плоско осветяване - всяка стена е едноцветна
				shininess: 80, // степен на лъскавост
				specular: 0x00ffcc // цвят на лъскавината
			});
			var solid = new THREE.Mesh( geometry, material );
			solid.scale.set(1.5, 1, 1);
			solid.position.set(0, -20, 0);
			scene.add( solid );
			
			
			var light = new THREE.PointLight( 'yellow', 500 );
			light.position.set( -20, -20, 50 );
			scene.add( light );

			light = new THREE.PointLight( 'green', 300 );
			light.position.set( 20, -20, 50  );
			scene.add( light );

			light = new THREE.PointLight( 'coral', 500 );
			light.position.set( -20, -20, 50  );
			scene.add( light );

			light = new THREE.PointLight( 'red', 300 );
			light.position.set( 20, -20, 70 );
			scene.add( light );
			

			function drawFrame( t )
			{
				solid.rotation.x = t/1000;
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
