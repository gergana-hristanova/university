<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";

			// Задача: създайте град в равнината - постройките
			// да са вертикални паралелепипеди със случайна
			// височина
			
			var N = 10; // 10x10 брой "карета" в града
			var D = (N - 1) / 2;
			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( 6, 7, 20 );
			camera.lookAt( scene.position );

			
			// някъде тук постройте града
			for (var x = 0; x < N; ++x)
			for (var z = 0; z < N; ++z)
			{
				var height = Math.random() * (N - 1);

				var wid_len = Math.max(0.5, Math.random() * 1);

				var geometry = new THREE.BoxGeometry( wid_len, height, wid_len );
				var material = new THREE.MeshPhongMaterial( );
				var building = new THREE.Mesh( geometry, material );
				building.position.set(x - D, height / 2 - D, z - D);
				scene.add( building );
			}


			var light = new THREE.PointLight( 'white', 100 );
			light.position.set( 3, 7, 9 );
			scene.add( light );

			light = new THREE.PointLight( 'white', 100 );
			light.position.set( 3, 7, -9 );
			scene.add( light );

			
			function drawFrame( t )
			{
				scene.rotation.y = t/2000;
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
