<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";

			// Задача: Направете дупка в плочката
			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 30, aspect );
			camera.position.set( 6, 3, 8 );
			camera.lookAt( scene.position );

			var material = new THREE.MeshPhongMaterial( {color: 'chartreuse'} );

			var square_geom = new THREE.BoxGeometry( 1, 1, 1/3 );
			var rect_geom = new THREE.BoxGeometry( 1, 3, 1/3 );

			
			var plate1 = new THREE.Mesh( square_geom, material );
			scene.add( plate1 );
			plate1.position.set(0, 1, 0);

			var plate2 = new THREE.Mesh( square_geom, material );
			scene.add( plate2 );
			plate2.position.set(0, -1, 0);

			var plate3 = new THREE.Mesh( rect_geom, material );
			scene.add( plate3 );
			plate3.position.set(-1, 0, 0);

			var plate4 = new THREE.Mesh( rect_geom, material );
			scene.add( plate4 );
			plate4.position.set(1, 0, 0);

			var light = new THREE.PointLight( 'white', 15 );
			light.position.set( 3, 2, 3 );
			scene.add( light );

			renderer.render(scene, camera);
			
		</script>
	</body>
</html>
